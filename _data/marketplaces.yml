# Outbound marketplace deep links. {q} = URL-encoded query, {isbn} = ISBN.
# Descriptions are UsedBook.com's own summaries. Names are trademarks of their owners.
buy:
  - name: AbeBooks
    note: Independent sellers worldwide; strong for rare, out-of-print and first editions
    home: https://www.abebooks.com/
    isbn: https://www.abebooks.com/servlet/SearchResults?isbn={isbn}
    q: https://www.abebooks.com/servlet/SearchResults?kn={q}
  - name: ThriftBooks
    note: Large stock of low-priced used copies with condition grades
    home: https://www.thriftbooks.com/
    q: https://www.thriftbooks.com/browse/?b.search={q}
  - name: Better World Books
    note: Used books with a literacy-funding, book-reuse mission
    home: https://www.betterworldbooks.com/
    q: https://www.betterworldbooks.com/search/results?q={q}
  - name: Alibris
    note: Marketplace of independent booksellers; books, music and film
    home: https://www.alibris.com/
    q: https://www.alibris.com/booksearch?mtype=B&keyword={q}
  - name: Biblio
    note: Independent and antiquarian booksellers
    home: https://www.biblio.com/
    q: https://www.biblio.com/search.php?keyisbn={q}
  - name: eBay
    note: Auctions and fixed-price listings; useful for checking sold prices
    home: https://www.ebay.com/
    q: https://www.ebay.com/sch/i.html?_nkw={q}&_sacat=267
  - name: Amazon
    note: New and used offers from many third-party sellers
    home: https://www.amazon.com/
    q: https://www.amazon.com/s?k={q}&i=stripbooks
  - name: Powell's Books
    note: Large independent bookstore selling new and used
    home: https://www.powells.com/
    q: https://www.powells.com/searchresults?keyword={q}
  - name: BookFinder
    note: Meta-search across many booksellers, new and used
    home: https://www.bookfinder.com/
    q: https://www.bookfinder.com/search/?keywords={q}&mode=basic&st=sr&ac=qr
  - name: Bookshop.org
    note: New copies that support independent bookstores
    home: https://bookshop.org/
    q: https://bookshop.org/search?keywords={q}
  - name: WorldCat
    note: Find a library copy near you to borrow for free
    home: https://search.worldcat.org/
    q: https://search.worldcat.org/search?q={q}
  - name: Open Library
    note: Free digital lending and catalogue records
    home: https://openlibrary.org/
    q: https://openlibrary.org/search?q={q}
  - name: Google Books
    note: Previews, editions and publication details
    home: https://books.google.com/
    q: https://www.google.com/search?tbm=bks&q={q}
sell:
  - name: BookScouter
    note: Compares instant buyback offers from many vendors
    home: https://bookscouter.com/
    isbn: https://bookscouter.com/book/{isbn}
  - name: BooksRun
    note: Textbook and general book buyback with prepaid shipping
    home: https://booksrun.com/
  - name: World of Books (Sell)
    note: Instant quotes for used books, media and textbooks
    home: https://sell.worldofbooks.com/en-us
  - name: ValoreBooks
    note: Textbook sellback and marketplace
    home: https://www.valorebooks.com/
  - name: eCampus
    note: Textbook buy, rent and sell
    home: https://www.ecampus.com/
  - name: Powell's Books
    note: Buys used books online and in its Portland stores
    home: https://www.powells.com/
  - name: eBay (list it yourself)
    note: Best for collectibles; research sold listings first
    home: https://www.ebay.com/sl/sell
    q: https://www.ebay.com/sch/i.html?_nkw={q}&_sacat=267&LH_Sold=1&LH_Complete=1
  - name: AbeBooks (seller program)
    note: For rare and collectible stock; check asking prices for your edition
    home: https://www.abebooks.com/
    isbn: https://www.abebooks.com/servlet/SearchResults?isbn={isbn}
    q: https://www.abebooks.com/servlet/SearchResults?kn={q}
  - name: PangoBooks
    note: Peer-to-peer app for selling everyday reads
    home: https://pangobooks.com/
  - name: Half Price Books
    note: In-store buying at its US locations
    home: https://www.hpb.com/
