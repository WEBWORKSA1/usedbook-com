# Well-known used and secondhand bookstores and book towns. Notes are our own summaries.
- name: Powell's City of Books
  city: Portland, Oregon
  country: USA
  note: A city-block-sized store shelving new and used books side by side.
- name: Strand Book Store
  city: New York City
  country: USA
  note: Long-running Manhattan bookstore known for new, used and rare stock.
- name: Argosy Book Store
  city: New York City
  country: USA
  note: Antiquarian bookshop dating to the 1920s, with rare books, maps and prints.
- name: The Last Bookstore
  city: Los Angeles, California
  country: USA
  note: Downtown store mixing new and used books, records and art spaces.
- name: Moe's Books
  city: Berkeley, California
  country: USA
  note: Multi-floor new, used and antiquarian bookstore on Telegraph Avenue.
- name: Green Apple Books
  city: San Francisco, California
  country: USA
  note: Neighbourhood favourite for new and used books.
- name: Bart's Books
  city: Ojai, California
  country: USA
  note: Largely open-air used bookstore with outdoor shelves.
- name: John K. King Used & Rare Books
  city: Detroit, Michigan
  country: USA
  note: Huge used and rare stock in a converted industrial building.
- name: Second Story Books
  city: Washington, DC area
  country: USA
  note: Long-established dealer in used and rare books.
- name: Haslam's Book Store
  city: St. Petersburg, Florida
  country: USA
  note: Family-run store in business since the 1930s, mostly used books.
- name: Book Barn
  city: Niantic, Connecticut
  country: USA
  note: Sprawling used-book complex spread across several buildings.
- name: Russell Books
  city: Victoria, British Columbia
  country: Canada
  note: One of Canada's largest used and new bookstores.
- name: Shakespeare and Company
  city: Paris
  country: France
  note: Famous English-language bookshop on the Left Bank selling new and secondhand books.
- name: Barter Books
  city: Alnwick, England
  country: UK
  note: Large secondhand bookshop inside a Victorian railway station.
- name: Leakey's Bookshop
  city: Inverness, Scotland
  country: UK
  note: Big secondhand bookshop housed in a former church.
- name: Hay-on-Wye (book town)
  city: Hay-on-Wye, Wales
  country: UK
  note: Small town famous for its many secondhand and antiquarian bookshops.
- name: Atlantis Books
  city: Oia, Santorini
  country: Greece
  note: Small, much-photographed bookshop selling new and used books.
